<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTN-FRBA · HideFace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="/logo.png" alt="UTN-FRBA" />
          <div>
            <h1>UTN-FRBA · HideFace</h1>
            <p>Proyecto CIBIO</p>
          </div>
        </div>
        <ul class="status-row" aria-label="Estado del sistema">
          <li>
            <span class="dot" id="status-engine" data-state="idle"></span>
            Motor <strong id="engine-label">cargando</strong>
          </li>
          <li>
            <span class="dot" id="status-camera" data-state="idle"></span>
            Cámara <strong id="camera-label">apagada</strong>
          </li>
          <li>
            <span class="dot" id="status-faces" data-state="idle"></span>
            Caras <strong id="faces-label">0</strong>
          </li>
        </ul>
      </header>

      <main class="stage">
        <section class="viewport" aria-label="Vista de cámara">
          <video id="camera" playsinline muted hidden></video>
          <canvas id="frame"></canvas>
          <div class="viewport-overlay" id="empty-state">
            <h2>Tus imágenes protegidas.</h2>
            <p>
              Encendé la cámara.
              <br> Capturá una o varias imágenes.
              <br> Por último, descargalas.
            </p>
          </div>
          <div class="hud">
            <span id="hud-fps">0 fps</span>
            <span id="hud-size">—</span>
            <span id="hud-blur">desenfoque 25</span>
          </div>
        </section>

        <aside class="panel">
          <section class="card">
            <h2>Captura</h2>
            <div class="actions">
              <button id="btn-camera" class="btn primary" type="button">
                Encender cámara
              </button>
              <button id="btn-shot" class="btn shutter" type="button" disabled>
                Sacar foto
              </button>
            </div>
            <p class="hint">
              La foto se guarda ya procesada.
            </p>
          </section>

          <section class="card">
            <h2>Blurreo de cara</h2>
            <label class="switch">
              <input id="toggle-blur" type="checkbox" checked />
              <span>Desenfocar rostros en tiempo real</span>
            </label>
            <label class="switch">
              <input id="toggle-mesh" type="checkbox" checked />
              <span>Mostrar malla facial (478 puntos)</span>
            </label>
            <label class="field">
              <span>Intensidad del desenfoque <em id="blur-value">25</em></span>
              <input id="blur-range" type="range" min="4" max="51" step="1" value="25" />
            </label>
          </section>

          <section class="card gallery-card">
            <div class="gallery-head">
              <h2>Disponibles</h2>
              <span id="gallery-count">0 fotos</span>
            </div>
            <div id="gallery" class="gallery"></div>
            <div class="actions compact">
              <button id="btn-export" class="btn ghost" type="button" disabled>
                Descargar todas
              </button>
              <button id="btn-clear" class="btn danger-ghost" type="button" disabled>
                Vaciar
              </button>
            </div>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
